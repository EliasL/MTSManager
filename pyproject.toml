[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MTS_Management"
version = "0.1.0"
description = "Small, explicit tools for current MTS2D simulations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mesh = ["numpy", "meshio"]

[project.scripts]
mts = "MTS_Management.cli:main"

[tool.setuptools.package-data]
MTS_Management = ["defaults.json"]

[tool.setuptools.packages.find]
include = ["MTS_Management*"]
