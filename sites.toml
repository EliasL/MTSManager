# Shared site profiles. SSH users, keys and connection details stay in ~/.ssh/config.
# Remote Python must be >=3.11; set python to an absolute path if needed.
# Paths are relative to this file for local execution. Keep new builds isolated.
[sites.local]
directory = "."
source = "../MTS2D"
executable = "../MTS2D/build/release/MTS2D"
output_root = "output"
state_dir = ".state"
mode = "foreground"
native_arch = true


[sites.magi]
ssh = "magi"
disabled = false
directory = "~/simulation/MTS"
python = "python3"
management_module = "MTS_Management"
manager_directory = "~/.local/share/mts/manager"
source = "MTS2D"
executable = "build/current/MTS2D"
output_root = "~/MTS2D_current_output/benchmark-magi-20261023"
state_dir = ".state"
mode = "slurm"
setup = "source /etc/profile.d/modules.sh\nmodule load /softs/trixie/modules/x86-64/slurm/default"
native_arch = false
environment = { "OMP_PLACES" = "cores", "OMP_PROC_BIND" = "close", "OMP_DYNAMIC" = "FALSE", "OMP_DISPLAY_ENV" = "VERBOSE", "OMP_DISPLAY_AFFINITY" = "TRUE" }
slurm_cpus_per_thread = 2
slurm = { "time" = "3-00:00:00", "partition" = "COMPUTE", "mem" = "4G" }

