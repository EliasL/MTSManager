# Shared site profiles. SSH users, keys and connection details stay in ~/.ssh/config.
# Remote Python must be >=3.11; set python to an absolute path if needed.
# Paths are relative to this file for local execution. Keep new builds isolated.
[sites.local]
directory = "."
source = "../MTS2D"
executable = "../MTS2D/build/release/MTS2D"
output_root = "output"
state_dir = ".state"
mode = "foreground"
native_arch = true

# Verified SSH alias, Python 3.12 and Slurm. Deploy this package before use.
[sites.pascal]
ssh = "pascal"
management_module = "mtscripts" # Existing deployment; leave queued jobs unchanged.
directory = "~/simulation/NewSimulationScripts"
source = "../MTS2D-current-11100d1"
python = "python3"
executable = "build/MTS2D"
output_root = "/data/elundheim/MTS2D_current_output"
state_dir = ".state"
mode = "slurm"
[sites.pascal.slurm]
time = "01:00:00"
mem = "4G"

# MAGI COMPUTE: two hardware threads per physical core; compact OpenMP binding.
[sites.magi]
ssh = "magi"
management_module = "mtscripts" # Existing deployment; leave queued jobs unchanged.
directory = "~/simulation/MTSManager-benchmark-magi-20261023"
source = "../MTS2D-benchmark-magi-20261023"
python = "python3"
executable = "build/MTS2D"
output_root = "~/MTS2D_current_output/benchmark-magi-20261023"
state_dir = ".state"
mode = "slurm"
native_arch = false
slurm_cpus_per_thread = 2
setup = "source /etc/profile.d/modules.sh\nmodule load /softs/trixie/modules/x86-64/slurm/default"
[sites.magi.slurm]
time = "3-00:00:00"
partition = "COMPUTE"
mem = "4G"
[sites.magi.environment]
OMP_PLACES = "cores"
OMP_PROC_BIND = "close"
OMP_DYNAMIC = "FALSE"
OMP_DISPLAY_ENV = "VERBOSE"
OMP_DISPLAY_AFFINITY = "TRUE"

# Verify paths and cluster setup before use.
[sites.schwartz]
